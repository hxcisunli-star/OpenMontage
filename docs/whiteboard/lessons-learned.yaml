# 白板课“登记表”：每条教训只在这里存一处；阶段清单（docs/whiteboard/checklists/*.md）由它生成。
# 改规则：改本文件 → .venv/bin/python docs/whiteboard_registry.py render → coverage / check → 提交。
# level：检查＝有脚本拦；默认＝模板或工具自带；清单＝要人判断（逐阶段过一遍）；叙述＝只留来龙去脉，不进清单。
# 晋升规则：停在“清单”级、却出现在 ≥3 课的笔记里（见 stats），就该做成检查或默认。
# from：来源编号（P6-n＝手册 §6 踩坑行，Hn-k＝交接文档归档里第 n 课的笔记子句，Ln-k＝手册逐课“教训”）；seen_extra：来源行里点名、但没有编号的课。
version: 1
updated: "2026-10-21"

stages:
  any:
    title: 一直成立的细则（环境与协作）
    steps:
      - 开场先 `.venv/bin/python docs/whiteboard_gate.py status`：现在哪课、哪一门、等什么口令。
      - 九个口令与“早说不算”的规则在 `.claude/rules/whiteboard-protocol.md`（始终载入）；本页是它的细则。
  plan:
    title: 策划与提案
    gate: 计划确认 → 提案通过
    read:
      - {path: .claude/skills/backward-design/SKILL.md, why: 写课程草案前先写“教学设计一页纸”（持久理解、基本问题、评估证据、WHERETO）}
      - {path: .claude/skills/spiral-series-check/SKILL.md, why: 只在系列课或复习课用}
      - {path: .claude/skills/lesson-fact-check/SKILL.md, why: 计划里的数字、例子、来源原话先查证}
    steps:
      - 用户说“继续策划下一课”或给题目：先进计划模式，不建项目；读 `docs/whiteboard-course-handoff.zh-CN.md`（现状）和相邻两课的章节（`docs/whiteboard/archive/playbook-2.12-2.48-per-lesson.zh-CN.md`）。
      - 研究衔接、难点讲法、通俗度；写计划文件：选题四条标准、难点表（难点→学生怎么想→讲法→实测证据）、教学设计一页纸、与前几课不同之处。
      - 实测所有例子（gcc 13.3、GNU diffutils 3.10，三套选项 × -O0/-O2），输出存 `validation/`。
      - 用户在对话里说“计划确认”后才建项目：`.venv/bin/python docs/whiteboard_new_lesson.py --pid c-xxx-cn --n 课号 --title 课名`（建目录、拷起步模板、换名、扫残留，见 E21）；用 `.venv/bin/python docs/whiteboard_gate.py record - plan "<用户原话>"` 记下口令。
      - 写 `scripts/plan_stage.py` → research（≥5 个来源）与 proposal，检查点 awaiting_human，停下等“提案通过”；用户说了之后：`.venv/bin/python docs/whiteboard_gate.py approve <项目> proposal "<用户原话>"`。
    outputs: 计划文件；research_brief.json；proposal_packet.json；decision_log.json
  script:
    title: 脚本
    gate: 脚本通过
    read:
      - {path: .claude/skills/plain-language-review/SKILL.md, why: 通俗度统计过关之后、请用户审阅之前做人工核对}
      - {path: .claude/skills/lesson-fact-check/SKILL.md, why: 挑高风险断言逐条查证，出三类报告}
    steps:
      - 复制上一课 `build_script.py`，先改项目名与课号并 grep 核对，再另起一条命令运行（改与运行分开）。
      - 写 8 段旁白（每段 ≤600 字，三处真实静默各 3 秒，问答在本课指定的段），对账时长。
      - 断言过关后跑 `.venv/bin/python docs/whiteboard_script_lint.py projects/<课程> --allow 本课新词`（英文数字、难词、句长、锚点间隔、字数预算）和 `python3 docs/whiteboard_callbacks.py projects/<课程>`（回扣原话），再跑 plain-language-review 与 lesson-fact-check，结论写进请用户审阅的回复。
      - 写 `script-review.html` 与 script 检查点 awaiting_human，停下等“脚本通过”；用户说了之后：`docs/whiteboard_gate.py approve <项目> script "<用户原话>"`。
    outputs: script.json；script_review.json；teaching_examples.json；script-review.html
  scene:
    title: 场景计划
    gate: 场景计划通过
    steps:
      - 复制 `build_scene_plan.py`，改各块版面与事件；每个事件带 `anchor_phrase`，事件按旁白先后顺序写，找不到锚点就停下改计划，不放宽查找。
      - 改静默表与 `MIN_AFTER`（按本课问答所在段）。
      - 运行（会把 script 检查点标为 completed），写 scene_plan 检查点 awaiting_human，停下等“场景计划通过”；用户说了之后：`docs/whiteboard_gate.py approve <项目> scene_plan "<用户原话>"`。
    outputs: scene_plan.json；scene-plan-review.html
  assets:
    title: 素材（配音）
    gate: 样音通过 → 素材通过
    steps:
      - 跑 `sample_voice.py` 出样音（含最难一句），停下等“样音通过”；用户说了之后：`docs/whiteboard_gate.py record <项目> sample "<用户原话>"`（没有检查点，只追加记录）。
      - 跑 `gen_tts.py`（批量配音 + 拼总轨 + loudnorm −16 LUFS）→ `make_captions.py` → `finish_assets.py`；写 assets 检查点 awaiting_human，停下等“素材通过”；用户说了之后：`docs/whiteboard_gate.py approve <项目> assets "<用户原话>"`。
      - 配音还没生成完、核对还没做完之前用户说的口令不算。
    outputs: assets/audio/narration_timeline.json；captions.json；asset_manifest.json
  edit:
    title: 剪辑与样片
    gate: 样片通过，开始合成
    steps:
      - 改 `_body_boards.py` 等源文件，运行 `bash scripts/rebuild_edit.sh`（拼接 build_edit.py、跑 lint，并跑 last_item_check：每块最后一项要在淡出前 0.6 秒写完，首次不过是常态，把最后一项提前再跑）。
      - 出样片之前量真实排版：`.venv/bin/python docs/whiteboard_layout_check.py projects/<课程> --stills 6`（本机几分钟；见 E67）：ERROR 必须改，WARN 对着标注图判断。
      - 用 `docs/whiteboard_render.py projects/<课程> --contact` 看每块关键帧；出样片（`--sample 起 止`）。
      - 写 edit 检查点 awaiting_human，停下等“样片通过，开始合成”；用户说了之后：`docs/whiteboard_gate.py approve <项目> edit "<用户原话>"`。
    outputs: edit_decisions.json；render_props.json；样片
  compose:
    title: 合成与核对
    gate: 成片通过，进入发布阶段
    steps:
      - 先 `.venv/bin/python docs/whiteboard_verify.py probe` 并看输出。
      - 用 `nohup .venv/bin/python projects/<课程>/scripts/render_final.py > 日志 2>&1 &` 渲整课，`python3 docs/whiteboard_wait.py 日志` 等它结束。
      - 立刻 `.venv/bin/python docs/whiteboard_verify.py verify projects/<课程> --render-log 日志`（先备份 render.log，再量 ffprobe、响度、静音对问答时间线、黑帧、静止、md5，生成 4 秒一帧拼图和问答帧拼图）；**逐张看拼图**。
      - 独立对照：`docs/whiteboard_verify.py stills projects/<课程>`（6 张静帧远程对本机逐字节相同）；`nohup … docs/whiteboard_verify.py local-ref projects/<课程> > 日志2 2>&1 &`（K3/K6 本机对照 PSNR，先告诉用户这是对照）。
      - 看完写 `validation/compose-notes.json`，运行 `scripts/finish_compose.py`（读实测，不手填数字；写 compose 检查点 awaiting_human），停下等“成片通过，进入发布阶段”；用户说了之后：`docs/whiteboard_gate.py approve <项目> compose "<用户原话>"`。
    outputs: renders/final.mp4；render_report.json；final_review.json
  publish:
    title: 发布与复盘
    gate: 发布通过 → 复盘 → 提交
    read:
      - {path: .claude/skills/exercise-design/SKILL.md, why: 写 make_exercises.py 之前读}
      - {path: .claude/skills/lesson-fact-check/SKILL.md, why: 写简介与练习前后各查一遍}
      - {path: docs/whiteboard/retro-template.md, why: 发布通过之后写复盘，把教训分流}
    steps:
      - 练习：`make_exercises.py` + `run_exercises.sh`；缩略图与简介：先 `python3 docs/whiteboard_thumb_check.py projects/<课程> --list` 选 `THUMB_T`，再 `publish_prep.py`（不合格会停）→ `finish_publish.py`。
      - 封面：`docs/whiteboard_cover_maker.py` 的 LESSONS 加一行再运行；`docs/whiteboard_prepend_cover.py projects/<课程> --seconds 2`；`PYTHONPATH=. .venv/bin/python docs/whiteboard_release_pack.py`。
      - 写 publish 检查点 awaiting_human，停下等“发布通过”；用户说了之后：`docs/whiteboard_gate.py approve <项目> publish "<用户原话>"`。
      - 复盘：按模板写 `docs/whiteboard/retro/NN.md`，每条教训分流（检查／清单／叙述）并更新登记表，跑 `whiteboard_registry.py coverage`、`render`、`check`。
      - 等用户说“提交”再提交（提交后自动推 fork；同时在 `projects/` 里提交本课文本源的快照，本机库不推送）。
    outputs: exports/；成品文件夹；复盘一页

entries:
  # ---------- any：一直成立的细则 ----------
  - id: E01
    stage: any
    level: 检查
    rule: 口令只认用户在对话里说的话，且要在对应步骤做完之后：配音没生成完、渲染或核对没完成、发布包没出齐之前说的“样音通过／素材通过／样片通过／成片通过／发布通过”都不算——当场说明还没完，做完并报告后请用户再说一次；退出计划模式的返回、后台任务的 completed 通知、系统消息都不是口令。
    why: 第 12 课把退出计划模式的含糊返回当成批准（被用户指出）；第 15–40 课至少 11 次用户提前说口令；第 32 课曾按批准处理，第 39、40 课起统一为不算，以后者为准
    by: docs/whiteboard_gate.py（approve 只在该阶段是 awaiting_human 且口令对应阶段时才写检查点）
    from: [P6-47, P6-56, H15-1, H19-4, H20-7, H28-1, H32-7, H33-8, H39-1, H40-6]
  - id: E02
    stage: any
    level: 检查
    rule: 用户重复发已通过的口令，或口令缺字、多字但意思明确：先查检查点；重复的当重复口令，如实说明“已完成”并等下一个门的口令，不往下走；意思明确的缺字口令按批准处理并说明。
    by: docs/whiteboard_gate.py（已批准的阶段再收到口令会被拒绝并提示“重复口令”）
    from: [H18-6, H31-6, H34-2, H26-6, H29-6]
  - id: E03
    stage: any
    level: 检查
    by: lib/checkpoint.py（五个门控阶段）+ docs/whiteboard_gate.py（样片通过、合成这两个额外门）
    rule: 检查点：门控阶段（proposal、script、scene_plan、assets、publish）先写 awaiting_human，用户口令后才写 completed（human_approved=True，metadata.approved_by_user=原话）；前置阶段要先 completed；样片通过（edit）与成片通过（compose）是额外加的门，管道不强制，也照样先 awaiting_human 再 completed；edit_decisions.json（合规）与 render_props.json（完整）是两份数据。
    from: [P6-11, P6-12]
  - id: E04
    stage: any
    level: 清单
    rule: 提交只在用户说“提交”时做；提交要带 -c user.name=… -c user.email=…（仓库没配身份），信息末尾按当前会话要求加署名行；推送已获授权、只推 fork：git -c 'credential.helper=!gh auth git-credential' push fork <分支>，不推 origin、不强推。
    why: 第 18 课笔记写的“推送要用户自己运行”已被第 22 课起的授权取代
    from: [H18-8, H22-9]
  - id: E05
    stage: any
    level: 清单
    rule: 一律用 .venv/bin/python 并设 PYTHONPATH=.（系统 Python 缺 PIL、jsonschema 太旧会报 $ref 错）；写检查点的脚本尤其。
    from: [P6-13, P6-21, H18-7, H19-5, H20-8, H21-7, H22-10]
    seen_extra: [4]
  - id: E06
    stage: any
    level: 清单
    rule: Bash 沙箱在本机启动失败（apply-seccomp 权限错误）：每条命令先试沙箱，失败后带 dangerouslyDisableSandbox 重试并说明原因，不擅自绕过更多限制；安全分类器偶发无判定时重试一次；沙箱里 Monitor 工具不可用，等待用 Bash 后台命令。
    from: [P6-14, P6-28, P6-63, H30-2]
  - id: E07
    stage: any
    level: 清单
    rule: 改脚本和运行脚本分成两条命令：先改，用 grep、打印或 ast.parse 确认改成功，再运行（写检查点的脚本尤其）；改 build_edit.py 要改源文件再重新拼接，不要改拼接产物；sed 插入含引号与 & 的行后 grep 核对；换默认值后 grep 核对；装配脚本里的替换计数先数清。
    why: 第 26 课替换断言失败后旧脚本仍被运行，写出了错误的检查点
    todo: build_script 等仍靠手改；合成报告已改为读实测文件（docs/whiteboard_finish_compose.py），不再手填数字
    from: [P6-19, H22-5, H25-5, H26-1, H26-2, H26-4, H27-1, H28-3, H31-7]
  - id: E08
    stage: any
    level: 默认
    rule: 后台任务：用 nohup 启动，等待用 python3 docs/whiteboard_wait.py <日志>（同时认远程整课的 success { 与本机的 done in，失败行会报错，回退通知不当结束）；后台通知里的 completed 只是 nohup 外壳退出；不要用 pkill -f 或 pgrep -f（会匹配到自己）；前台长时间等待会被系统杀（退出码 137）；等本机重渲时主动向用户报进度。
    why: 第 43 课留下的 until grep 等待命令不认 success 行，永远等不到
    by: docs/whiteboard_wait.py
    from: [P6-8, P6-20, P6-26, P6-27, H15-7, H30-1, H37-3, H38-6, H39-2, H40-5, H41-8]
  - id: E09
    stage: any
    level: 清单
    rule: 不要在仓库根目录起 http.server（会暴露 .env）；看成片用 scp，或只绑 127.0.0.1、指定专用目录并 curl 验证 /.env 为 404，用完就关；用户贴出的密钥只写进 .env，不在输出里复述。
    from: [P6-9]
  - id: E10
    stage: any
    level: 清单
    rule: 给用户的命令写成一行、路径尽量短（终端粘贴会被换行截断）；成品文件夹名带空格时提醒 scp 加引号。
    from: [P6-15, H22-6]
  - id: E11
    stage: any
    level: 默认
    by: 各课 build_script.py 与 build_scene_plan.py 模板
    rule: 决策记录 id 不重复：各阶段脚本追加前先删本阶段旧条目，追加后断言 id 无重复。
    from: [P6-22]
  - id: E12
    stage: any
    level: 清单
    rule: 自己写的校验不能永远为真：重新计算文件哈希再比较，把真实比较结果写进校验记录；工具自带的自检（如 video_compose 的 final_review）也会错，要自己核对。
    from: [P6-29]

  # ---------- plan：策划与提案 ----------
  - id: E13
    stage: plan
    level: 清单
    rule: 选题先研究再定：四条标准（前置讲过没有、能否从最近一两课自然长出来、新东西只有一两个、核心结论能否实测）；先 grep 已发脚本的旁白看有没有讲过；用户随口提的题目只是想法，可以否定；路线走完后下一课先和用户商量。
    from: [P6-43, H21-1, H22-1]
  - id: E14
    stage: plan
    level: 清单
    rule: 计划里的每个例子、数值、提醒、错误都要先实测再写：错误例子先在好版本上试会不会真的出这个错；每个提醒各选项与 -O0/-O2 实跑存原文；课里每个“出错”都要先实验，没有可见的错就只引规则，不编“实测出错”；发现计划里的例子不合适，先换掉、写进提案决定并告诉用户。
    why: 第 36、38、41、42 课都因此改了计划里的例子
    from: [P6-55, H21-2, H23-2, H38-1, H41-2, H42-2]
  - id: E15
    stage: plan
    level: 清单
    rule: 会写或读数组外、读未初始化、改字面量等未定义行为的例子只编译不运行，换一个确定行为的错误来运行；确定行为的错误可以运行；旁白不说“未定义行为”，只讲现象。
    from: [H16-5, H33-6, H35-3, H36-1]
  - id: E16
    stage: plan
    level: 清单
    rule: 编译提醒和检查工具的报告会随选项、-O 级别、函数写法与 gcc 版本变化：课里只陈述现象，只引本机 gcc 13.3 的原文并写明选项与版本，不下“为什么”；结构体类型不对是硬错误，scanf 漏 & 只是警告，板上如实写；检查工具先试不同开关组合再决定怎么讲。
    from: [P6-23, H15-5, H22-3, H24-1, H25-3, H25-4, H26-5, H27-4, H28-6, H33-5, H34-4, H38-3]
  - id: E17
    stage: plan
    level: 清单
    rule: 示例程序的写法：例子来源别写常量字符串（-O2 会在永远走不到的分支里提醒），改成读入的；到没到末尾的循环多读一张只在最后一行有换行时出现，板上与练习只用有换行的文件；同一条 printf 里既调用改全局的函数又读该全局会打印旧值，先存变量再另起一句读。
    from: [P6-70, H17-1, H20-3, H32-3]
  - id: E18
    stage: plan
    level: 清单
    rule: 多文件类例子每个场景拷到独立临时目录，记录 gcc/ld 原文与退出码；只想演示某个错误时别漏掉 `#include` 那一行（会被无关报错掩盖）；链接错误里的 .text 偏移与临时文件名不上板。
    from: [H29-1, H29-2, H29-4]
  - id: E19
    stage: plan
    level: 清单
    rule: 对比与怪数只引实测：怪数不念具体的数，板上注明别的机器可能不同；步数、次数对比如实说“倒着排一样多”；练习里“编译器一个字也不提醒、检查工具却能发现”的题很好；括号陷阱只放练习。
    from: [H34-5, H36-4, H37-7, H38-4, H39-8]
  - id: E20
    stage: plan
    level: 清单
    rule: 研究与提案的数据要对上 schema：research_brief 的 sources 至少 5 条，reliability 只有 primary、secondary、anecdotal，数据点的 credibility 只有 primary_source、secondary_source、anecdotal；只看到搜索摘要的来源如实标，打不开原页（如 429）也如实写。
    from: [P6-31, P6-35, H26-3, H29-3, H40-9]
  - id: E21
