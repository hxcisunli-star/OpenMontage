# 系列配置：每个系列一段。系列由项目名前缀决定（docs/whiteboard_lessons.py 的 series_of：`agent-…-cn` 是智能体篇，其余是 C 篇）。
# 工具（建课脚手架、封面、成品包、旁白检查、回扣检查）都从这里读，不在代码里写死医生、系列名、成品文件夹。
# 新系列：在这里加一段，并把角色素材放进 cast_dir（素材图只在本机，不进库；`projects/` 整个被外层仓库忽略）。
c:
  name: "C语言白板课"                       # 封面右上角的系列标识与成品文件夹名的来源
  pack_dir: "C语言白板课_成品"
  bare_lesson_refs: c                       # 旁白里的“第N课”指 C 篇自己的课
  cast_dir: null                            # null＝老做法：医生图、校徽从“来源课”拷（whiteboard_new_lesson.py 的 LEGACY_ASSETS）
  cover_cast: null                          # null＝封面用 C 篇的医生图
  forbid_terms: []
agent:
  name: null                                # 系列名由用户另定；没定时封面与成品包明确报错，不用占位
  pack_dir: null                            # 默认 "<name>_成品"
  bare_lesson_refs: self                    # 旁白里的“第N课”指本系列自己的课；与 C 课没有任何联系，不回扣、不用 C 课的比喻
  template_lesson: agent-messages-cn        # 新课脚本从它起步（试验课，只作模板；不是课程）
  cast_dir: projects/_cast/agent            # 角色素材库：老师（候选 A）与 AI 小搭档（候选 C）的各个姿势、校徽
  cast_assets: [teacher_hold.png, teacher_point_l.png, teacher_think.png, robot_wave.png, robot_point_l.png, robot_idea.png, robot_confused.png, teacher_oops.png, robot_cheer.png, schoollogo.png]
  logo: schoollogo.png
  cast_references:                          # 新课的 references/ 里放的参考图（给 whiteboard_pose_tool.py pose 做图生图用）：目标文件名 → cast_dir 里的原图
    ref_teacher.png: raw/teacher_main.png
    ref_robot.png: raw/robot_main.png
  cover_cast:                               # 封面上的角色：file 在 cast_dir 里，h＝高（像素），right/bottom＝离画面右/下边的距离
    - {file: teacher_point_l.png, h: 860, right: 150, bottom: 70}
    - {file: robot_wave.png, h: 330, right: 520, bottom: 70}
  cover_text_width: 1060                    # 标题与副标题的最大宽度（要给搭档留出位置）
  # 新系列与 C 课无关：这些是 C 课的身份词（医生比喻、第 2 课克隆门……），旁白里出现就是回扣，旁白检查报错
  forbid_terms: [C语言, 医生, 病历, 病房, 门诊, 克隆门, 结构体]
  # 场景计划的每个场景在 movement 开头写“呈现手段：手段1、手段2；……”，手段取自这份清单（风格指南第 4 节：按教学内容选最合适的呈现方式）
  presentation_required: true
  # 第二轮（2026-10-21）按工程与呈现效果裁定：保留 题卡与倒计时圆环、对错分屏、红叉与哎呀、词元计数条、时序图；“代码与结果面板”现含代码上色（code 项的 lang）。
  # 不在清单里：H3 片头与 H3 比喻片段（评估后不采用，工具休眠）、曲线图（kit 里有函数，试点没用到、没在课里验证过）。音效与角色微动不是场景手段（见风格指南第 7 节）。
  devices: [便条飞行, 聊天气泡, 柱状图, 插画卡片, 圈注与荧光笔, 镜头推近, 角色表演, 色块与分区, 代码与结果面板, 题卡与倒计时圆环, 对错分屏, 红叉与哎呀, 词元计数条, 时序图, 纯板书]
