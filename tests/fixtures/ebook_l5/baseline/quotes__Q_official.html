<figure class="show" data-record="Q_official"><div class="fh">三页官方文档怎么说“温度 0”</div><div class="qcards"><div class="qcard"><b class="qwho">谷歌云（Gemini 企业版平台）文档</b><p class="qen" lang="en">In this case, responses for a given prompt are mostly deterministic, but a small amount of variation is still possible.</p><p class="qzh">回复大多是确定的，但可能仍然有少量变化。（页面中文版原句）</p><span class="qid">存档 A61 + A62（2026-11-03 存档，2026-11-04 重取原页核对）</span></div><div class="qcard"><b class="qwho">Anthropic（克劳德）词汇表</b><p class="qen" lang="en">Even with temperature set to 0, the results will not be fully deterministic</p><p class="qzh">译：即使温度设为 0，结果也不完全确定。</p><span class="qid">存档 A59（2026-11-03 存档，2026-11-04 重取原页核对）</span></div><div class="qcard"><b class="qwho">谷歌的 Gemini 接口提示指南（另一份文档）</b><p class="qen" lang="en">A temperature of 0 is deterministic, meaning that the highest probability response is always selected.</p><p class="qzh">译：温度 0 是确定的，意思是总选概率最高的。</p><p class="qfoot">同页提示框：Gemini 4 和 3.6 及以上的模型忽略 temperature、top_p、top_k 的自定义值</p><span class="qid">存档 A43（2026-11-03 存档，2026-11-04 重取原页核对）</span></div></div><p class="pnote muted">原文逐字取自取页当天的页面；第一张的中文是该页面自带的中文版原句，不是我们翻的，另两张的中文是我们译的。谷歌那一页的提示框另写：Gemini 4 与 3.6 以上的模型会忽略 temperature 等设置。卡片小字里的“存档 A…”是我们存档那几页时用的编号。</p><figcaption class="rec"><span class="tag tag-source">引文</span> 2026-11-04 重取原页核对 · 三页说法各自成立，这里不判谁对</figcaption></figure>
