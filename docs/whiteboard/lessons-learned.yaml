  - id: E67
    stage: edit
    level: 检查
    by: docs/whiteboard_layout_check.py
    rule: 出样片之前量真实排版：`.venv/bin/python docs/whiteboard_layout_check.py projects/<课程> --stills 6`（本机、几分钟）。它在浏览器里量每个板书的真实盒子：叠字、文字被板边裁掉、压到字幕条或校徽、描边从中间穿过文字、内存格装不下自己的值、手写体或等宽体缺字（豆腐块）。ERROR 必须改，WARN 对着标注图判断；退出码 2 表示没量全，不算通过。whiteboard_lint 里的重叠警告只是估算。
    why: 估算只认 write 一种板书、按字数算宽度（手写体实际比估的宽），代码板、内存格、图片、字幕条、校徽都不看；探针第一版也曾因字体没加载完而把手写字量窄，是靠把盒子画在真实静帧上才发现的。
    from: [Hlayout-1]
  - id: E68
    stage: edit
    level: 清单
    rule: 真实排版检查按“有意”处理、所以不会报的：红“×”划掉某个值或整个框、画在文字上的短标记和整行划线、指向用的笔形指针、箭头尖落在标签上、别的条目画的强调框切到字（和故意圈词的框一模一样）；它也看不到动画过程中的瞬间重叠（只量“画完”的采样帧）。这些要靠出样片后看 --contact 的关键帧总览。
    from: [Hlayout-2]

