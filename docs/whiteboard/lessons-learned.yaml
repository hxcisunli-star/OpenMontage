    rule: "提案里写的“错误一定导致某现象”（尤其“漏掉某一条就会……”），提案通过前真实运行一遍并存 validation：漏掉一条之后，信息可能还在别的条里；预测题、错误例子、结尾邀请的答案都要有实测文件。"
    why: "试验品的提案把“漏贴助手的回答就不认得名字”用在错误一、预测题二、结尾邀请三处，已批准后实测才发现不成立（名字在用户第一句里），三处都改了"
