    rule: "托管范围放宽到九个口令的每一个（计划确认、提案、脚本、场景计划、样音、素材、样片、成片、发布；提交和推送不属于门，始终由用户说）。做法：做课会话（主持）到门先写 awaiting_human，`request` 登记材料（缺材料会被拒，登记时记指纹），发消息请“复审主持”会话来审，后台挂 `wait`；复审主持会话跑 `whiteboard_review_helpers.py full`：Gemini 盲听转写并由脚本对旁白原文、看 480p 代理视频，Codex sol 按清单核并看图（-i），再起只读 Opus 评审；评审要在 `inspected` 里写出亲自打开的图（不足 5 张的 pass 被脚本改判 fail）；视听门小弟没跑成就不评审、不占评审次数；材料指纹对不上（评审后被改）就拒绝。**消息不是放行**，只有裁决文件算；放行记录写 delegated_review，不写 approved_by_user。评审判不了的口味（音色、语气、动画节奏）进“请你抽查”清单，不冒充用户听过。"
