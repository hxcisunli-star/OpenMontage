<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Deterministic font environment for OpenMontage renders (local and remote use the SAME file).
  Used as FONTCONFIG_FILE for the headless Chrome that renders Remotion frames.
  The two tokens are replaced with absolute paths by whoever launches the render:
      @FONTS_DIR@  -> directory holding the DejaVu *.ttf next to this file
      @CACHE_DIR@  -> an empty, writable per-job cache directory
  Only DejaVu (bundled here) is visible: no system fonts, so every machine renders the same glyphs.
  Chinese text comes from the hand font loaded by the composition itself (public/fonts), never from system fonts.
  Rendering parameters below copy what the reference machine (Ubuntu 24.04, fontconfig 2.15) applies by default.
-->
<fontconfig>
  <dir>@FONTS_DIR@</dir>
  <cachedir>@CACHE_DIR@</cachedir>

  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
