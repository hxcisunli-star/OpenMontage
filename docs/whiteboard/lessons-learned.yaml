  - id: E85
    stage: edit
    level: 清单
    by: docs/whiteboard_sfx.py
    rule: "音效默认只开答案揭晓叮声（--cues light，第二轮裁定；pop 与 whoosh 默认关，--cues all 打开；背景音乐仍不加）。一条命令 docs/whiteboard_sfx.py apply <项目>（build 之后、渲染之前，样片与成片都带）：混音、核对静默与响度、把 render_props.json 的旁白指向 narration_sfx.wav（原路径记在 audio.narration.src_plain，apply --undo 撤销，audio 不进板书块指纹）。底层 cues/mix/check 从板书数据推提示点——便条、气泡、方块出现 pop，飞行起点前 15 毫秒 whoosh-short，答案揭晓后 0.3 秒 chime，项目可带可选字段 sfx 点名素材（合成器忽略它）；电平相对旁白语音 RMS（pop 与 whoosh −18 dB，chime −16 dB）；先混进旁白再渲染（合成器只放一条旁白轨），换音轨出有/无两版不用重渲；素材在 docs/whiteboard/sfx/（Pixabay 许可，CREDITS.md）。硬规则：问答静默（题目读完到 answer_not_before 的 3 秒）里不得有任何提示点，跨进去的截断淡出；混音后峰值要不高于 −1 dBFS（AAC 会过冲），落在旁白峰值上的提示点自动退让；80 毫秒内同名的提示点合并，否则叠成双倍音量；超出本块结束时间的项目（为插片段截短的板书）不发声；混完用 check 核对静默段与整体响度和无音效版一致。"
    why: "试点实测：58 个提示点，三段静默混前后完全一致、整体响度 −16.3 LUFS 不变；第一版峰值到 −0.2 dBFS（旁白本身 −1.5），有两个提示点落在旁白峰值上；261.15 秒有两个同刻的 pop；为插片段截短的 s7 里被截掉项目的 whoosh 仍会在片段播放时响。默认只开叮声的理由：旁白是主通道、板上有字，没有信息量的声音（每张便条一个 pop）是多余材料（多媒体学习的一致性原则），叮声标出“静默结束、现在公布答案”；我听不了，所以取保守默认，全量版成片留给用户听"
    from: [Hvu-13, Hvu-14, Hvu-15, Hvu-24]
