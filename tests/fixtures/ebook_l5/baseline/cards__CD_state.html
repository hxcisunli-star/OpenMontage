<figure class="show" data-record="CD_state"><div class="fh">几页官方文档：历史由谁管，之前的内容怎么计费</div><div class="l4-source-cards"><article class="l4-source-card"><h4>阿里云百炼</h4><p class="l4-iface">接口：多轮对话文档（聊天接口）</p><blockquote class="l4-quote">“通义千问 API 是无状态的，不会保存对话历史。要实现多轮对话，需在每次请求中显式传入历史对话消息，”</blockquote><p class="l4-gloss">大意：每次请求都要把历史对话消息带上。</p><p class="l4-archive">存档 A86 · 取页 2026-11-05</p></article><article class="l4-source-card"><h4>深度求索</h4><p class="l4-iface">接口：聊天补全接口</p><blockquote class="l4-quote">“DeepSeek `/chat/completions` API 是一个“无状态” API，即服务端不记录用户请求的上下文，用户在每次请求时，需将之前所有对话历史拼接好后，传递给对话 API。”</blockquote><p class="l4-gloss">大意：服务端不记录上下文，调用的人要把之前的历史拼好再传入。</p><p class="l4-archive">存档 A80 · 取页 2026-11-05</p></article><article class="l4-source-card"><h4>OpenAI</h4><p class="l4-iface">接口：聊天补全接口</p><blockquote class="l4-quote" lang="en">“Chat completions are stored by default for new accounts.”</blockquote><p class="l4-gloss">译：新账户的聊天补全默认会被存储。</p><p class="l4-archive">存档 A82 · 取页 2026-11-05</p></article><article class="l4-source-card"><h4>OpenAI</h4><p class="l4-iface">接口：Responses 接口（用编号接上之前的内容）</p><blockquote class="l4-quote" lang="en">“all previous input tokens for responses in the chain are billed as input tokens in the API.”</blockquote><p class="l4-gloss">译：链上之前各次响应的输入词元，在接口里按输入词元计费。</p><p class="l4-archive">存档 A81 · 取页 2026-11-05</p></article><article class="l4-source-card"><h4>阿里云百炼</h4><p class="l4-iface">接口：Responses 接口的响应编号</p><blockquote class="l4-quote">“本次响应的唯一标识符，为 UUID 格式的字符串，有效期为7天。可用于 previous_response_id 参数以创建多轮对话。”</blockquote><p class="l4-ours">我们的说明（不是页面原话）：有效期说的是这个编号能用多久。页面这一句没有写它是上下文容量，也没有写数据保留期限（我们没有找到）。</p><p class="l4-archive">存档 A09（2026-10-23 存档，2026-11-05 重取原页核对）</p></article></div><p class="l4-note">原话逐字取自我们存档的页面（档号是存档那几页的编号）；每张卡只对它名下的接口成立。</p><figcaption class="rec"><span class="tag tag-source">引文</span> 取页日期：2026-11-05 · 每张卡只对名下的接口成立</figcaption></figure>
