    from: [ext:agent第5课复盘]

  - id: E160
    stage: publish
    level: 清单
    rule: "前几课共用并已发布的文件（起步脚本）的说法不准时，不静默改（各课有逐字拷贝、检查脚本逐字比对）：在本课的练习与书里写准确说法，并列进验收汇报的待用户项，由用户定要不要改、怎么同步。"
    why: "第 5 课发现起步脚本 call_model.py 的注释说三个环境变量名“都不是官方名字”，其实 DASHSCOPE_API_KEY 就是百炼文档示例里的名字（A91）；脚本在第 1–3 课练习与章里有逐字拷贝，本课没改，只在第 6 题和书里写了准确说法。"
    from: [ext:agent第5课复盘]

  - id: E161
    stage: publish
    level: 清单
    rule: "起步脚本、练习或书里写“会拦住／会检查某类内容”的功能，先用合成串实测它的匹配面：中文紧挨、前后有标点、正常词里带相似片段（如 sk-learn）；说明里写清它按什么规则、只查哪个入口（聊天输入、系统消息、读回的旧记录）。Python 字符串正则里 \\b 是 Unicode 单词边界，汉字算单词字符，以 \\b 开头的规则遇到“密钥是sk-…”（中间没空格）会漏。"
    why: "第 6 课发布前复审，Codex 第 2 轮指出起步脚本的密钥形状正则开头是 \\b；我用合成串实测属实（有空格拦、没空格不拦）。书、简介、脚本开头原来都写“长得像密钥的内容不会发出去”，实际有两个缺口：中文紧挨密钥；系统消息和读回的旧记录发送前根本不查。已把规则改成英文字母数字下划线的后顾断言，并把说明写成“只按两条规则拦聊天输入”。"
    from: [ext:agent第6课复盘]

  - id: E162
    stage: publish
    level: 清单
    rule: "交付物（起步脚本）在脚本门之后要改时：先存改前版本和 diff，用语法树逐函数对比证明运行逻辑没动，重跑本机测试，再按顺序重走整条链（本机测试→说法清单→练习→电子书记录→章→简介→导出→封面→建站→整站检查→旧页面比对）；说法里“原样跑了 N 遍”这类依赖旧版本的话改成“改前的版本”；已批准的旧产物里引的旧哈希只是历史，不改；视频板书里画了脚本代码行或小字哈希的，视频不动，书里写明差别，并列给用户定要不要重渲。新用例并进现有测试，个数不变，板书和旁白里的“十一个”就不用动。用户选“随课勘误”时：简介加一段，exports/metadata/errata.txt 由成品包工具拷成 _随课勘误.txt（有这个文件才拷，别的课不受影响）；按 publish_prep→finish_publish --no-checkpoint→拼封面→sync 的顺序重导出（视频重编码后 md5 与已放行的相同，可核对），重导出会改写与站点硬链接的视频的修改时间，整站检查报告会显得比站点旧，要重跑 check_site 再打包；已放行的发布检查点不重写（E111）。"
    why: "第 6 课脚本改了 4 处（三处注释、一个正则）后，哈希前 12 位写在已批准的 script_review.json、claims_used.json 的范围里，练习生成器还断言嵌入的脚本哈希与 local_tests.json 相同；视频 s4 板书读 local_tests.json 的哈希、并画着旧正则那一行，成片已批准。我放大 f13 取帧才发现板书是旧的。"
    from: [ext:agent第6课复盘]

  - id: E163
    stage: publish
    level: 清单
    rule: "给平台新增图种或共用句子（证据抽屉、图注）时，句子要对新图种也成立：示意图不挂录制日期；官方引文卡的取页日期不算“录制日期”；徽标已写“示意”，图注就不再重复；“每条记录上都标了”改成“每条实测记录上都标了”。这些改动用只对新图种的章生效的开关，改完把旧页面逐页哈希与改平台之前的基准比对，必须一页不变（整站检查里同一条规则也要同步改）。"
    why: "第 6 课平台新加三种图，交叉复审 Codex 第 1 轮指出抽屉把引文取页日期（11-06）算进“录制日期”，Antigravity 第 2 轮又指出“每条记录上都标了”太绝对；示意图图注原来是“示意 示意 · 2026-11-07 · 示意图…”，读起来像某天的实测。我起先在处置表里写“不改”，没核对页面就下了结论，回页面 HTML 看过才更正。"
    from: [ext:agent第6课复盘]

  - id: E164
    stage: publish
    level: 清单
    rule: "派小弟写电子书章之前，先在迷你工作区里自己跑一遍 build_site：建站要的字体、头像图、存档页、检查脚本在派之前就补进工作区，别让小弟的 build_ok 因缺文件失败；工作区里的路径（ref/、out/、TASK.md）不要进要放回仓库的脚本（E153），自测建站后把 site 目录删掉再派。"
    why: "第 6 课建章工作区后自测建站连报三个缺文件（ZCOOL 字体、两张头像图、第 4 课的 verify_doc_quotes.py）才建成；平台测试交回时示例记录路径写成 out/example_records.json，放回仓库全报 FileNotFoundError，又犯了 E153。"
