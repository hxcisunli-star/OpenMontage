<figure class="show" data-record="CD_roles"><div class="fh">官方文档怎么写指令的先后</div><div class="l4-source-cards"><article class="l4-source-card"><h4>OpenAI</h4><p class="l4-iface">接口：文本生成指南</p><blockquote class="l4-quote" lang="en">“developer messages are instructions provided by the application developer, prioritized ahead of user messages.”</blockquote><p class="l4-gloss">译：开发者消息是应用开发者提供的指令，排在用户消息之前（优先）。</p><p class="l4-archive">存档 A83 · 取页 2026-11-05</p></article><article class="l4-source-card"><h4>Anthropic（克劳德）</h4><p class="l4-iface">接口：Messages 接口</p><blockquote class="l4-quote" lang="en">“When the two conflict, system instructions take precedence”</blockquote><p class="l4-gloss">译：两者冲突时，系统指令优先。</p><p class="l4-archive">存档 A89 · 取页 2026-11-05</p></article></div><p class="l4-note">每张卡只对它名下的那个接口成立；这里不说“各家都这样”。</p><figcaption class="rec"><span class="tag tag-source">引文</span> 取页日期：2026-11-05 · 每张卡只对名下的接口成立</figcaption></figure>
