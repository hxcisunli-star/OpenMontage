    rule: "小弟生成的中文数量词，2 在“个、条、张”前写“两”（两个模型、两条），不写“二个、二条”；生成脚本里用一个小函数统一，交回后在页面文字里搜“二个、二条”。"
    why: "第 6 课章里“二个标称模型”“只留二条”是 Codex 的写法（数字转汉字的函数把 2 写成二），我读真实页面文字时发现，复审第 1 轮的任务书里也把它列进检查项。"
