    why: "实测：4 秒请求 107 帧、196.8 秒出；5 秒比喻片段 124 帧、212.3 秒出（提交一次断线，同请求号重提成功）；1344×768、24 帧/秒，平涂、轮廓、配色、角色外貌基本保持，会指向、挥手、便条落下；编码略糊、瞳孔在动作中偏糊。原来写的“只能走 frame_seq、没有包装工具”已不对，第二轮改成整块 mp4 拼接并写了工具。裁定理由：片头放弃——4.5 秒无声片头加 2 秒封面使开头 6.5 秒没有教学内容，与“每课 2 秒封面”相悖，封面已带两个角色；比喻片段放弃——整屏硬切、片段里没有校徽与字幕，板上计数条更精确，每个约 200 秒生成，且试做的内容（旧便条被挤出）与那句旁白（越摞越贵、怎么办以后再讲）对不上"
    from: [Hvu-9, Hvu-18, Hvu-19, Hvu-20, Hvu-21, Hvu-23]

